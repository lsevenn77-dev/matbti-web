<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>관리자 · 나솔너솔</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/admin.css?v=1" />
</head>
<body>
  <header class="bar">
    <img src="/img/logo.webp" alt="나솔너솔" class="logo" />
    <strong>관리자</strong>
    <button type="button" id="btn-refresh" class="ghost" hidden>새로고침</button>
    <button type="button" id="btn-logout" class="ghost" hidden>나가기</button>
  </header>

  <main>
    <!-- 로그인 -->
    <section id="login" class="card login" hidden>
      <h1>관리자 로그인</h1>
      <p class="muted">서버 설정 파일(<code>/etc/nasolneosol.env</code>)의 <code>ADMIN_KEY</code> 값을 넣어 줘. 이 창을 닫으면 다시 입력해야 해.</p>
      <form id="login-form" autocomplete="off">
        <input type="password" id="key" placeholder="관리자 키" autocomplete="off" />
        <button type="submit" class="pk">들어가기</button>
      </form>
      <p class="err" id="login-err"></p>
    </section>

    <!-- 관리 -->
    <section id="panel" hidden>
      <div class="stats" id="stats"></div>
      <nav class="tabs" id="tabs">
        <button type="button" data-tab="open" class="on">접수된 신고</button>
        <button type="button" data-tab="resolved">처리 완료</button>
        <button type="button" data-tab="dismissed">기각</button>
        <button type="button" data-tab="all">전체</button>
        <button type="button" data-tab="banned">정지된 회원</button>
      </nav>
      <div id="list" class="list"></div>
    </section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/admin.js?v=1"></script>
</body>
</html>
